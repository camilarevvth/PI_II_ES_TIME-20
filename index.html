<!DOCTYPE html>
<html>
<head>
  <title>Lista de Usuários</title>
</head>
<body>
  <h1>Usuários</h1>
  <ul id="lista"></ul>

  <script>
    fetch('/dados')
      .then(res => res.json())
      .then(data => {
        const lista = document.getElementById('lista');
        data.forEach(usuario => {
          const item = document.createElement('li');
          item.textContent = `${usuario.nome} - ${usuario.email}`;
          lista.appendChild(item);
        });
      });
  </script>
</body>
</html>
